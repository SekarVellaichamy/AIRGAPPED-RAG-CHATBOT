<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Multi-Agent Chatbot</title>
    <!-- Bootstrap 5 -->
    <link href="/static/vendor/css/bootstrap.min.css" rel="stylesheet">
    <!-- API Utility -->
    <script src="/static/js/api.js"></script>
    <!-- Chart.js -->
    <script src="/static/vendor/js/chart.js"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="/static/vendor/css/bootstrap-icons.css">
    <!-- Toast Notifications -->
    <link rel="stylesheet" href="/static/css/toast.css">

    <style>
        .sidebar {
            height: 100vh;
            background-color: #343a40;
            color: white;
            min-width: 250px;
        }

        .sidebar a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 10px 20px;
            display: block;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #495057;
            color: white;
        }

        .content {
            flex-grow: 1;
            padding: 20px;
            background-color: #f8f9fa;
            height: 100vh;
            overflow-y: auto;
        }

        .card-stat {
            transition: transform 0.2s;
        }

        .card-stat:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column">
        <div class="p-3 mb-2 border-bottom border-secondary">
            <h4 class="mb-0">Admin Panel</h4>
        </div>

        <a href="/admin/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
        <a href="/admin/users" class="{% if active_page == 'users' %}active{% endif %}">
            <i class="bi bi-people me-2"></i> Users
        </a>
        <a href="/admin/files" class="{% if active_page == 'files' %}active{% endif %}">
            <i class="bi bi-files me-2"></i> Files
        </a>
        <a href="/admin/tools/convert" class="{% if active_page == 'tools' %}active{% endif %}">
            <i class="bi bi-markdown me-2"></i> Convert to MD
        </a>

        <div class="mt-auto p-3 border-top border-secondary">
            <a href="/logout" class="text-danger">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/vendor/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/toast.js"></script>
</body>

</html>
