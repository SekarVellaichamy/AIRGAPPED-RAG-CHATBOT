{% extends "admin/base_admin.html" %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0 text-gray-800">Convert to Markdown</h2>
    </div>

    <!-- Upload Card -->
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Upload File</h6>
        </div>
        <div class="card-body">
            <form id="convertForm">
                <div class="mb-3">
                    <label for="fileInput" class="form-label">Select File</label>
                    <div class="dropzone p-5 border-2 border-dashed rounded text-center"
                        style="border-style: dashed !important; border-color: #dee2e6; cursor: pointer;"
                        onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-cloud-arrow-up display-4 text-muted"></i>
                        <p class="mt-2 text-muted">Click to upload or drag and drop</p>
                        <small class="text-muted d-block">PDF, DOCX, XLSX, PPTX, HTML, etc.</small>
                        <p id="fileName" class="text-primary mt-2 font-weight-bold"></p>
                        <input id="fileInput" name="file" type="file" class="d-none" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" id="convertBtn" class="btn btn-primary">
                        <span id="btnText">Convert to Markdown</span>
                        <div id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Result Area -->
    <div id="resultArea" class="card shadow mb-4 d-none">
        <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">Conversion Result</h6>
            <button onclick="copyToClipboard()" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-clipboard"></i> Copy to Clipboard
            </button>
        </div>
        <div class="card-body">
            <pre id="markdownOutput" class="bg-light p-3 rounded"
                style="max-height: 600px; overflow-y: auto; white-space: pre-wrap; font-family: monospace;"></pre>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const form = document.getElementById('convertForm');
    const resultArea = document.getElementById('resultArea');
    const markdownOutput = document.getElementById('markdownOutput');
    const convertBtn = document.getElementById('convertBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    fileInput.addEventListener('change', function (e) {
        if (this.files && this.files[0]) {
            fileName.textContent = this.files[0].name;
        }
    });

    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        if (!fileInput.files.length) {
            alert('Please select a file first');
            return;
        }

        // Loading state
        convertBtn.disabled = true;
        btnText.textContent = 'Converting...';
        btnSpinner.classList.remove('d-none');
        resultArea.classList.add('d-none');

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/admin/tools/convert', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                markdownOutput.textContent = data.markdown;
                resultArea.classList.remove('d-none');
            } else {
                alert('Conversion failed: ' + data.error);
            }
        } catch (error) {
            alert('Error: ' + error);
        } finally {
            // Reset state
            convertBtn.disabled = false;
            btnText.textContent = 'Convert to Markdown';
            btnSpinner.classList.add('d-none');
        }
    });

    function copyToClipboard() {
        const text = markdownOutput.textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('button[onclick="copyToClipboard()"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-check"></i> Copied!';
            setTimeout(() => {
                btn.innerHTML = originalHtml;
            }, 2000);
        });
    }
</script>
{% endblock %}
